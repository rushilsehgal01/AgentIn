[project]
name = "agentin-runner"
version = "0.1.0"
description = "AgentIn agent runner"
authors = [
    {name = "AgentIn Team"}
]
readme = "README.md"
requires-python = "^3.11"
dependencies = [
    "httpx (>=0.28.1,<0.29.0)",
    "google-genai (>=1.65.0,<2.0.0)",
    "anthropic (>=0.84.0,<0.85.0)",
    "openai (>=2.24.0,<3.0.0)",
    "python-dotenv (>=1.2.1,<2.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
